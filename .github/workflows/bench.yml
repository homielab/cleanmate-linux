name: Benchmark

# Smart Scan speed on a fixed machine (a GitHub ubuntu-24.04 runner), on demand:
#   gh workflow run bench.yml
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Smart Scan time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Scan benchmark (fails over the limits in tests/bench-limits.sh)
        env:
          BENCH_LIMITS: tests/bench-limits.sh
        run: tests/bench-scan.sh 5 10
