name: Release

# Push a tag like v1.0.0 (its commit on main) → CI on that commit must pass, the .deb is built, and a GitHub Release
# is created with the .deb, the files `cm --update` installs (script, app tarball, SHA256SUMS) and the changelog notes. The same tag also
# starts ppa.yml (Launchpad PPA upload).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read # to read the CI run of the tagged commit

# one release per tag, never cancelled
concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches VERSION in the script
        run: |
          v=$(sed -n 's/^VERSION="\([0-9.]*\)"$/\1/p' cleanmate.sh)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but VERSION=$v"; exit 1; }
          s=$(sed -n 's/^version: "\(.*\)"$/\1/p' snap/snapcraft.yaml)
          [ "v$s" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME but snap version=$s"; exit 1; }

      - name: Install build tools (translations and PNG icons in the .deb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common

      - name: Build the .deb
        run: packaging/build-deb.sh

      # `cm --update` installs these only when they match SHA256SUMS
      - name: Update files and SHA256SUMS
        run: packaging/build-update-assets.sh

      # The tagged commit is on main, so CI (tests, ShellCheck, store metadata, packages)
      # already runs on it: wait for that run instead of testing twice. Red → no release.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 60); do
            id=$(gh run list -R "$GITHUB_REPOSITORY" -w ci.yml -c "$GITHUB_SHA" -e push -L 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo "::error::No CI run for $GITHUB_SHA: push the commit to main with the tag (or rerun CI on it)"; exit 1; }
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 30 --exit-status >/dev/null ||
            { echo "::error::CI failed on $GITHUB_SHA: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"; exit 1; }

      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb dist/cleanmate.sh dist/cleanmate-app.tar.gz dist/SHA256SUMS --title "CleanMate ${GITHUB_REF_NAME#v}" --notes-file notes.md

  # Publishes to the Snap Store (= Ubuntu App Center). Skipped until the
  # SNAPCRAFT_STORE_CREDENTIALS secret is set (snapcraft export-login).
  snap:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - name: Attach the snap to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ${{ steps.build.outputs.snap }}
      - uses: snapcore/action-publish@v1
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

