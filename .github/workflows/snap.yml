name: Snap

# By hand, to try a snap recipe change; every release builds the snap (release.yml).
# Release tags only (Boss 2026-11-21: no CI on push to main).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snap:
    name: Snap build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - name: Install the snap and run it
        run: |
          sudo snap install --classic --dangerous ${{ steps.build.outputs.snap }}
          cleanmate --version
