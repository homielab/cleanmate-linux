name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: "0.11.0" # newest release; bump on purpose, then fix what it reports

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }} (pinned, not the runner's)
        run: |
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v$SHELLCHECK_VERSION/shellcheck-v$SHELLCHECK_VERSION.linux.x86_64.tar.xz" |
            tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v$SHELLCHECK_VERSION" >>"$GITHUB_PATH"
      - name: ShellCheck (warnings and errors)
        run: shellcheck --version && shellcheck -S warning -x cleanmate.sh tests/run.sh tests/bench-*.sh packaging/*.sh packaging/flathub/build.sh po/*.sh
      - name: Python syntax (desktop app and every test script)
        run: python3 -m py_compile gui/cleanmate-gui $(find gui tests -name '*.py')
      - name: Pyflakes (when the runner has it)
        run: |
          if python3 -m pyflakes --version >/dev/null 2>&1; then python3 -m pyflakes gui tests; else echo "pyflakes not installed, skipped"; fi
      - name: Store metadata (AppStream, launcher)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq appstream desktop-file-utils
          appstreamcli validate --no-net data/com.homielab.CleanMate.metainfo.xml
          desktop-file-validate data/com.homielab.CleanMate.desktop

  test:
    name: Tests (${{ matrix.os }}, ${{ matrix.locale }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        # vi_VN and de_DE write decimals with a comma: numbers must still parse and read the same
        locale: [C.UTF-8]
        include:
          - { os: ubuntu-24.04, locale: vi_VN.UTF-8 }
          - { os: ubuntu-24.04, locale: de_DE.UTF-8 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pyte (terminal emulator for the TUI smoke test)
        run: python3 -m pip install --user pyte || python3 -m pip install --user --break-system-packages pyte
      - name: Install GTK 4 + libadwaita (desktop app self-test; skipped on 22.04) and GStreamer (video thumbnails)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libgtk-4-bin gir1.2-gstreamer-1.0 gstreamer1.0-plugins-base
      - name: Install gettext (translations are compiled into the .deb) and sqlite3 (browser privacy test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext sqlite3
      - name: Add a language with a decimal comma (sizes must read the same in every language)
        run: sudo locale-gen vi_VN.UTF-8 de_DE.UTF-8
      - name: Run tests
        env:
          LANG: ${{ matrix.locale }}
          LC_ALL: ${{ matrix.locale }}
        # the decimal-comma languages only rerun the tests that format or sort numbers and texts
        run: |
          if [[ $LC_ALL == C.UTF-8 ]]; then tests/run.sh
          else tests/run.sh 'size|human|decimal|number|lang|transl|messages|large|lens|overview|history|free|disk|details'; fi

  ppa:
    name: PPA package (every series)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential devscripts debhelper lintian python3-gi gir1.2-gdkpixbuf-2.0 librsvg2-common gettext
      - name: Build the source packages (the series in ppa.yml), then the noble .deb from one (as Launchpad does)
        run: |
          packaging/build-source.sh -us -uc
          for s in $(sed -n 's/^  SERIES: *"\(.*\)"$/\1/p' .github/workflows/ppa.yml); do
            grep -qx "Distribution: $s" dist/ppa/cleanmate_*~"${s}"_source.changes || { echo "::error::No source package for $s"; exit 1; }
          done
          mkdir build && cd build
          dpkg-source -x ../dist/ppa/*~noble.dsc
          cd cleanmate-*/ && dpkg-buildpackage -b -us -uc
      - name: Lintian
        run: lintian --fail-on error build/*.changes dist/ppa/*.dsc
      - name: Install it and run it
        run: |
          sudo apt-get install -y -qq ./build/cleanmate_*_all.deb
          cm --version

  snap:
    name: Snap build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: snapcore/action-build@v1
        id: build
      - name: Install the snap and run it
        run: |
          sudo snap install --classic --dangerous ${{ steps.build.outputs.snap }}
          cleanmate --version
      - uses: actions/upload-artifact@v7
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
