# Snap Store package. Built in CI (ci.yml) and published on v* tags (release.yml).
#
# A system cleaner can't work strictly confined (it must read hidden folders,
# system logs and package caches), so this uses classic confinement. Classic
# needs a manual approval on the Snapcraft forum before the store accepts it.
# The first request (Oct 2026) was declined as too early (new project, small
# community, no user base yet), so the snap is built in CI but not published;
# the PPA (debian/) is the apt route meanwhile. See docs/PUBLISHING.md.
name: cleanmate
title: CleanMate
base: core24
version: "2.3.0"
summary: Free up space and keep Ubuntu tidy
description: |
  CleanMate finds what is taking up space on your computer and lets you
  remove it safely — caches, old logs, leftovers from removed packages,
  developer and AI tool caches, and more. Nothing is deleted until you have
  seen the list and confirmed.

  It comes as a desktop app and a terminal app (cm) that share one engine.
  System items use the standard password dialog; everything else runs as you.
license: MIT
contact: contact@homielab.com
issues: https://github.com/homielab/cleanmate-linux/issues
source-code: https://github.com/homielab/cleanmate-linux
website: https://github.com/homielab/cleanmate-linux
donation: https://ko-fi.com/homielab
icon: data/icons/hicolor/scalable/apps/com.homielab.CleanMate.svg
grade: stable
confinement: classic

# Shell and Python only, so one build runs everywhere (named *_all.snap).
# Without this the store's build service builds every architecture separately
# (and fails on i386, which core24 doesn't have).
platforms:
  all:
    build-on: [amd64]
    build-for: [all]

parts:
  cleanmate:
    plugin: nil
    build-packages: [gettext]
    source: .
    override-build: |
      d=$CRAFT_PART_INSTALL
      install -D -m 755 cleanmate.sh "$d/usr/bin/cleanmate"
      install -d "$d/usr/share/cleanmate/gui/cleanmate_gui"
      install -m 755 gui/cleanmate-gui "$d/usr/share/cleanmate/gui/"
      install -m 644 gui/cleanmate_gui/*.py "$d/usr/share/cleanmate/gui/cleanmate_gui/"
      bash po/compile.sh "$d/usr/share/locale"
      install -D -m 644 data/com.homielab.CleanMate.metainfo.xml \
        "$d/usr/share/metainfo/com.homielab.CleanMate.metainfo.xml"
      install -D -m 644 data/icons/hicolor/scalable/apps/com.homielab.CleanMate.svg \
        "$d/usr/share/icons/hicolor/scalable/apps/com.homielab.CleanMate.svg"
      # snapd only accepts Exec lines that run this snap, so drop the
      # "Open in Terminal" action (it runs x-terminal-emulator).
      sed -e 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/scalable/apps/com.homielab.CleanMate.svg|' \
        -e '/^Actions=/d' -e '/^\[Desktop Action/,$d' \
        data/com.homielab.CleanMate.desktop |
        install -D -m 644 /dev/stdin "$d/usr/share/applications/com.homielab.CleanMate.desktop"

apps:
  cleanmate:
    command: usr/bin/cleanmate
    desktop: usr/share/applications/com.homielab.CleanMate.desktop
    common-id: com.homielab.CleanMate
